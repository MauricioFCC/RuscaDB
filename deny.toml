# cargo-deny — política de supply chain de RuscaDB (§6.5, SPEC-0016).
# Cuatro checks declarados: advisories + licenses + bans + sources.
# Complementado por cargo-audit (RustSec) y gitleaks pre-commit.
# Validado en T1 por `.github/workflows/ci.yml` (EmbarkStudios/cargo-deny-action)
# y por `scripts/check_ci_config.py`. Ver docs/verification.md.

[advisories]
# Esquema actual de cargo-deny (>=0.16): `vulnerability`, `notice` y
# `severity-threshold` fueron REMOVIDOS (toda vulnerabilidad/aviso es error).
# `unmaintained`/`unsound` son ahora *scope*: all|workspace|transitive|none.
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
unused-ignored-advisory = "warn"
ignore = []

[licenses]
# Mantener la allow-list ajustada: avisa si se permite una licencia no usada.
unused-allowed-license = "warn"
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las dependencias internas usan `workspace = true` (path sin versión): son
# path-deps, no wildcards de registro. `allow-wildcard-paths` evita el falso
# positivo; los crates externos siguen sin poder usar wildcards.
allow-wildcard-paths = true
# Preferir rustls/ring sobre OpenSSL nativo.
deny = [{ name = "openssl-sys" }]
# Crates inseguras/obsoletas conocidas (se amplía por fase).
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
