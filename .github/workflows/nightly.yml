# Nightly de RuscaDB — Gate T3 (regresión, alert-only).
#
# Alineado con docs/RuscaDB-roadmap.md §7.1 y SPEC-0016. Este pipeline NO
# bloquea PRs: corre en `schedule`/`workflow_dispatch`, todos los jobs son
# `continue-on-error: true` (alert-only) y suben artifacts para inspección.
#   mutation   -> cargo-mutants full sharded, umbral documentado MS >= 85 %
#   fuzz       -> cargo-fuzz sobre query_parse y wal_recover (libFuzzer, nightly)
#   miri       -> UB/unsafe en crates sin unsafe (query, fts, core)
#   sanitizers -> AddressSanitizer sobre ruscadb-ffi (nightly, linux-gnu)
#   test-macos -> cargo test --workspace --all-features en macOS (SPEC-0046)
#   loom       -> model checking del MVCC con --cfg loom (SPEC-0053)
#
# El gate T1 (determinista, bloquea merge) vive en `.github/workflows/ci.yml`.

name: Nightly (T3)

on:
  schedule:
    # 03:00 UTC diario (fuera de horario laboral).
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── T3.1 — Mutation full sharded (alert-only, MS documentado >= 85 %) ────────
  mutation:
    name: Mutation (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: cargo mutants (shard ${{ matrix.shard }}/8)
        # Umbral T3 documentado: mutation score >= 85 % (roadmap FF-08).
        # Alert-only: no bloquea merge; el reporte se adjunta como artifact.
        run: cargo mutants --workspace --shard=${{ matrix.shard }}/8 --in-place

      - name: Mutation score (informativo, umbral MS >= 85 %)
        if: always()
        run: |
          file=mutants.out/outcomes.json
          if [ ! -f "$file" ]; then
            echo "No hay outcomes.json; se omite el cálculo del mutation score."
            exit 0
          fi
          caught=$(jq '[.outcomes[] | select(.summary == "CaughtMutant")] | length' "$file")
          missed=$(jq '[.outcomes[] | select(.summary == "MissedMutant")] | length' "$file")
          total=$((caught + missed))
          if [ "$total" -eq 0 ]; then
            echo "Sin mutantes evaluables en este shard."
            exit 0
          fi
          awk -v c="$caught" -v t="$total" \
            'BEGIN { printf "MS shard = %.2f %% (objetivo >= 85 %%)\n", 100 * c / t }'

      - name: Upload mutants outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-outcomes-${{ matrix.shard }}
          path: mutants.out/outcomes.json
          if-no-files-found: warn
          retention-days: 30

  # ── T3.2 — Fuzzing continuo (libFuzzer, nightly) ────────────────────────────
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [query_parse, wal_recover]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: cargo fuzz run query_parse (300 s, con dictionary)
        # `-dict` se resuelve relativo a `fuzz/` (working-directory); las
        # claves de RQL se inyectan al mutar el corpus (SPEC-0042).
        if: matrix.target == 'query_parse'
        working-directory: fuzz
        run: cargo +nightly fuzz run query_parse -- -max_total_time=300 -dict=query_parse.dict

      - name: cargo fuzz run wal_recover (300 s)
        if: matrix.target == 'wal_recover'
        working-directory: fuzz
        run: cargo +nightly fuzz run wal_recover -- -max_total_time=300

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  # ── T3.3 — Miri: UB/unsafe en crates sin `unsafe` ───────────────────────────
  miri:
    name: Miri (UB/unsafe)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      - name: miri setup
        run: cargo +nightly miri setup

      - name: cargo miri test (crates sin unsafe)
        run: cargo +nightly miri test -p ruscadb-query -p ruscadb-fts -p ruscadb-core

  # ── T3.4 — Sanitizers (AddressSanitizer, nightly, SPEC-0033) ────────────────
  # Detección de memoria insegura (use-after-free, buffer overflow) en el
  # adapter FFI, el único crate con `unsafe` permitido (unsafe-allowlist.toml).
  # Requiere nightly + rust-src. Alert-only: no bloquea merge.
  sanitizers:
    name: Sanitizers (ASan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2

      - name: cargo test -p ruscadb-ffi (AddressSanitizer)
        # `ASAN_OPTIONS=detect_leaks=0`: el runtime del sanitizer y el allocator
        # de Rust no son leak-clean por diseño; interesan los errores de memoria.
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          set -o pipefail
          cargo +nightly test -p ruscadb-ffi \
            --target x86_64-unknown-linux-gnu 2>&1 | tee asan-test.log

      - name: Upload ASan log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitizers-asan-log
          path: asan-test.log
          if-no-files-found: warn
          retention-days: 30

  # ── T3.5 — macOS: cobertura cross-platform fuera del PR (SPEC-0046) ─────────
  # El job `test` de ci.yml limita su matriz a ubuntu+windows (feedback rápido).
  # macOS se valida aquí en `schedule`/`workflow_dispatch` porque su cola de
  # runners es larga (~20 min) y no debe retrasar el PR. Alert-only.
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # ── T3.6 — Loom: model checking del MVCC (SPEC-0053, alert-only) ───────────
  # Explora planificaciones de commits/snapshots concurrentes con --cfg loom.
  loom:
    name: Loom MVCC
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: loom model tests
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test -p ruscadb-txn --test loom_mvcc
