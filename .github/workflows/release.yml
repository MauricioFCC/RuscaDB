# Release de RuscaDB (SPEC-0089) — publica un GitHub Release al empujar un tag v*.
#
# Mínimo privilegio (NF-0089-02): el workflow corre con `contents: read` a nivel
# raíz; el job `release` eleva a `contents: write` solo para crear el Release.
#
# Flujo: valida que el CHANGELOG tenga la sección [X.Y.Z] del tag, corre los
# gates de arquitectura/config, genera el SBOM CycloneDX como artefacto,
# compila el ejecutable `ruscadb` para todas las plataformas soportadas
# (Windows x64/arm64, Linux x64/arm64 gnu+musl, macOS x64/arm64) y publica el
# Release con los binarios, los checksums SHA-256 y las notas del CHANGELOG.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a liberar (p. ej. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve tag to release
        id: tag
        run: |
          ref="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          echo "value=$ref" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG enlazado con el tag
        run: python scripts/check_changelog.py CHANGELOG.md --tag "${{ steps.tag.outputs.value }}"
      - name: Guards de arquitectura y config de CI
        run: |
          python scripts/check_architecture.py
          python scripts/check_ci_config.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: SBOM (CycloneDX)
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: "**/bom.json"
          if-no-files-found: warn
          retention-days: 90

  binaries:
    name: Build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: "true"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: "true"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: "true"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: "true"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: "false"
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: "true"
          - target: x86_64-apple-darwin
            os: macos-13
            cross: "false"
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain de cruce (${{ matrix.target }})
        if: matrix.cross == 'true'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: "release-${{ matrix.target }}"
      - name: Build del ejecutable
        run: cargo build --release --locked -p ruscadb-cli --target ${{ matrix.target }}
      - name: Empaquetado + checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/ruscadb"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="${bin}.exe"; fi
          cp "$bin" "dist/ruscadb-${{ matrix.target }}"
          tar -czf "dist/ruscadb-${{ matrix.target }}.tar.gz" -C dist "ruscadb-${{ matrix.target }}"
          cd dist
          sha256sum "ruscadb-${{ matrix.target }}" > "ruscadb-${{ matrix.target }}.sha256"
          rm "ruscadb-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [gate, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download binaries
        uses: actions/download-artifact@v6
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Checksums consolidados
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ruscadb-* > SHA256SUMS || true
          cat SHA256SUMS
      - name: Extract release notes from CHANGELOG
        run: python scripts/check_changelog.py CHANGELOG.md --tag "${{ needs.gate.outputs.tag }}" --notes-out release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.gate.outputs.tag }}" \
            --title "${{ needs.gate.outputs.tag }}" \
            --notes-file release-notes.md \
            dist/*
