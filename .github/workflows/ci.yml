# CI de RuscaDB — Gate T1 (determinista, < 90 s, bloquea merge).
#
# Pipeline alineado con docs/RuscaDB-roadmap.md §7.1:
#   Lint        -> fmt + clippy -D warnings
#   Test        -> cargo test --workspace --all-features --locked (matriz cross-platform)
#   Architecture-> guards de hexagonal + unsafe (scripts/check_*.py)
#   Security    -> cargo-deny + cargo-audit
#
# Crash-tests con kill real (SPEC-0056) viven en la suite unitaria T1
# (`crates/ruscadb-wal/src/crash_tests.rs`); el recovery adversarial se cubre
# en T3 por fuzz `wal_recover`.
#
# Cross-platform (SPEC-0033/SPEC-0046): el job `test` corre en paralelo sobre
# linux/windows (strategy.matrix.os) para feedback rápido en push/PR. macOS se
# valida en `.github/workflows/nightly.yml` (job `test-macos`, schedule) por la
# cola de runners, que no debe bloquear el PR.
#
# T2 (LLM-judge) corre sobre el diff del PR. El job `mutation-diff` (MS_diff >=
# 70 %, SPEC-0061) es la parte determinista y bloqueante de T2: muta solo el
# diff del PR y falla bajo el umbral. T3 (regresión nightly: mutation full
# sharded, fuzz, miri, sanitizers ASan) es alert-only y
# vive en `.github/workflows/nightly.yml` (SPEC-0016/SPEC-0033). Ver
# docs/verification.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    # Cross-platform (SPEC-0033/SPEC-0046): el mismo slice corre en linux y
    # windows (matriz rápida). macOS se valida en `nightly.yml` (job
    # `test-macos`) porque su cola de runners es larga. `fail-fast: false`
    # garantiza que un runner rojo no cancele la evidencia del otro.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: hexagonal + dependency cycles
        run: python scripts/check_architecture.py
      - name: unsafe policy
        run: python scripts/check_core_unsafe.py
      # D1 (retrospectiva 5): la consistencia de esta propia config de CI
      # se declara gate T1 en AGENTS.md/verification.md; debe correr en CI,
      # no solo local. Valida ci.yml/nightly.yml/mutants.toml/deny.toml.
      - name: CI config consistency
        run: python scripts/check_ci_config.py
      - name: SDD traceability (spec -> test)
        run: cargo xtask trace
      # D2 (retrospectiva 5): contrato bidireccional spec <-> test
      # (K1/K2/K3) documentado como T1 pero hasta ahora solo local.
      - name: SDD contract (test -> spec, implemented fully traced)
        run: cargo xtask contract

  security:
    name: Security
    runs-on: ubuntu-latest
    # rustsec/audit-check publica un check-run: requiere `checks: write` ademas
    # de `contents: read` (si no, falla con "Resource not accessible by integration").
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo-audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc (API reference)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  # SBOM CycloneDX (supply chain, roadmap §6.5). No bloqueante: informa la
  # composicion de dependencias y se adjunta a los releases.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Generate CycloneDX SBOM (JSON)
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom-cyclonedx
          path: "**/bom.json"
          if-no-files-found: warn
          retention-days: 30

  # Mutación sobre el diff del PR (parte determinista y bloqueante de T2,
  # SPEC-0061). Muta solo lo tocado por el PR y exige MS_diff >= 70 % vía
  # scripts/mutation_diff_gate.py. Solo corre en pull_request (necesita la
  # rama base); en push a main no hay diff contra el que medirse.
  mutation-diff:
    name: Mutation diff (MS>=70%)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff vs base
        run: git diff origin/${{ github.base_ref }}...HEAD > pr.diff
      - name: Mutants in diff
        run: cargo mutants --in-diff pr.diff --in-place --baseline=skip -o mutants.out
      - name: Gate MS_diff >= 70
        run: python scripts/mutation_diff_gate.py mutants.out/outcomes.json --min-score 70
      - name: Upload mutants outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-diff-outcomes
          path: mutants.out/outcomes.json
          if-no-files-found: warn
          retention-days: 30

  # Cobertura llvm-cov multi-scope (SPEC-0061 + SPEC-0079): core >= 80 %,
  # txn/wal >= 90 % (hard floor; medido 96.5 %/96.6 % el 2026-10-13). Corre la
  # suite completa instrumentada en ubuntu y aplica scripts/coverage_gate.py;
  # bloquea el merge bajo cualquier umbral de scope.
  coverage:
    name: Coverage (core>=80, txn/wal>=90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Build examples (smoke SPEC-0087)
        # `cargo llvm-cov` invoca `cargo test --tests`, que NO compila los
        # examples; el test de humo los ejecuta como binarios reales, así que
        # se pre-compilan en el target-dir que llvm-cov usará después.
        run: cargo build --examples --workspace --all-features --locked --target-dir target/llvm-cov-target
      - name: Coverage lcov
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Gate core>=80 / txn>=90 / wal>=90
        run: python scripts/coverage_gate.py lcov.info --scope ruscadb-core/ --min-line 80 --min-branch 70 --scope ruscadb-txn/ --min-line 90 --min-branch 70 --scope ruscadb-wal/ --min-line 90 --min-branch 70
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 30
