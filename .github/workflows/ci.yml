# CI de RuscaDB — Gate T1 (determinista, < 90 s, bloquea merge).
#
# Pipeline alineado con docs/RuscaDB-roadmap.md §7.1:
#   Lint        -> fmt + clippy -D warnings
#   Test        -> cargo test --workspace --locked
#   Architecture-> guards de hexagonal + unsafe (scripts/check_*.py)
#   Security    -> cargo-deny + cargo-audit
#
# T2 (LLM-judge) corre sobre el diff del PR. T3 (regresión nightly: mutation
# full sharded, fuzz, miri, crash-recovery) es alert-only y vive en
# `.github/workflows/nightly.yml` (SPEC-0016). Ver docs/verification.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: hexagonal + dependency cycles
        run: python scripts/check_architecture.py
      - name: unsafe policy
        run: python scripts/check_core_unsafe.py
      - name: SDD traceability (spec -> test)
        run: cargo xtask trace

  security:
    name: Security
    runs-on: ubuntu-latest
    # rustsec/audit-check publica un check-run: requiere `checks: write` ademas
    # de `contents: read` (si no, falla con "Resource not accessible by integration").
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo-audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc (API reference)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  # SBOM CycloneDX (supply chain, roadmap §6.5). No bloqueante: informa la
  # composicion de dependencias y se adjunta a los releases.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Generate CycloneDX SBOM (JSON)
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "**/bom.json"
          if-no-files-found: warn
          retention-days: 30
