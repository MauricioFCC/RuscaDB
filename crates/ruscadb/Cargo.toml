[package]
publish = false
name = "ruscadb"
description = "Fachada y composition root de RuscaDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["database", "embedded", "vector", "graph", "multimodal"]
categories = ["database", "database-implementations", "data-structures"]

[lints]
workspace = true

# La lib no tiene `#[bench]` (criterion vive en `benches/`); evita que
# `cargo bench --workspace` invoque el harness de libtest con flags ajenos.
[lib]
bench = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ruscadb-core = { workspace = true }
ruscadb-storage = { workspace = true }
ruscadb-query = { workspace = true }
ruscadb-vector = { workspace = true }
ruscadb-graph = { workspace = true }
ruscadb-multimodal = { workspace = true }
ruscadb-ai = { workspace = true }
ruscadb-fts = { workspace = true }
ruscadb-fvs = { workspace = true }
ruscadb-btree = { workspace = true }
ruscadb-txn = { workspace = true }
ruscadb-wal = { workspace = true }
ruscadb-ts = { workspace = true }
ruscadb-crypto = { workspace = true }
postcard = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
pretty_assertions = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "facade_smoke"
harness = false
