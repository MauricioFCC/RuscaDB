[package]
publish = false
name = "ruscadb"
description = "Fachada y composition root de RuscaDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["database", "embedded", "vector", "graph", "multimodal"]
categories = ["database", "database-implementations", "data-structures"]

[lints]
workspace = true

# La lib no tiene `#[bench]` (criterion vive en `benches/`); evita que
# `cargo bench --workspace` invoque el harness de libtest con flags ajenos.
[lib]
bench = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ruscadb-core = { workspace = true }
ruscadb-storage = { workspace = true }
ruscadb-query = { workspace = true }
ruscadb-vector = { workspace = true }
ruscadb-graph = { workspace = true }
ruscadb-multimodal = { workspace = true }
ruscadb-ai = { workspace = true }
ruscadb-fts = { workspace = true }
ruscadb-fvs = { workspace = true }
ruscadb-btree = { workspace = true }
ruscadb-txn = { workspace = true }
ruscadb-wal = { workspace = true }
ruscadb-ts = { workspace = true }
ruscadb-crypto = { workspace = true }
postcard = { workspace = true }
# Persistencia del ModelRegistry en <data>.models.json (SPEC-0064).
serde_json = { workspace = true }
# CRC32C por línea del audit persistido (SPEC-0073).
crc32c = { workspace = true }
zeroize = { workspace = true }
# Spans de frontera (SPEC-0080): no-op sin subscriber, coste despreciable.
tracing = { workspace = true }
# Compresión zstd (SPEC-0121, opcional).
zstd = { version = "0.14", optional = true }
# Arrow columnar (SPEC-0124, opcional).
arrow = { version = "60", optional = true }
# PostgreSQL wire protocol (SPEC-0127, opcional).
pgwire = { version = "0.42", optional = true }
# Métricas opcionales (SPEC-0080): solo presentes con la feature `metrics`.
metrics = { workspace = true, optional = true }

[features]
# Features plausibles (pure Rust, sin deps externas) activadas por defecto.
# Las features con deps externas (zstd, arrow, pgwire, metrics) quedan off.
default = [
    "columnar",
    "geo",
    "compression",
    "fts-advanced",
    "ts-advanced",
    "observability",
    "backup",
    "ts-retention",
    "fts-scoring",
    "incremental-backup",
    "time-travel",
    "spatial",
    "ivf-pq",
    "onnx",
    "pgwire",
    "otel",
    "cow-btree",
    "begin-concurrent",
    "lance-format",
    "vle",
    "sync",
    "branching",
    "geo-proj",
    "sql-std",
    "cost-planner",
    "kms",
    "stemming",
    "ts-aggregates",
    "rql-expr",
    "rql-subqueries",
    "rql-cte",
    "rql-set-ops",
    "rql-window-funcs",
    "prepared-real",
    "page-checksums",
    "segmented-wal",
    "mvcc-gc-real",
    "ssi",
    "rabitq",
    "acorn",
    "persistent-hnsw",
    "learned-index",
    "alp",
    "fastlanes",
    "blockmax-wand",
    "gorilla-ts",
    "crdt-sync",
    "post-quantum",
    "rcu",
    "ivf-clustering",
    "prepared",
    "materialized-views",
    "simd",
    "async-io",
    "fts-proximity",
    "join-reorder",
    "otel-real",
    "rtree-split",
    "backup-verify",
    "time-travel-real",
    "query-cache",
    "schema-evolution",
]
# Latencia de commit (SPEC-0080): OFF por defecto (coste cero). Propaga a
# `ruscadb-storage` para registrar el hit-rate del buffer pool.
metrics = ["dep:metrics", "ruscadb-storage/metrics"]
# SPEC-0110: engine columnar opcional (sin dependencias externas por defecto).
columnar = []
# SPEC-0111: inferencia ONNX opcional (sin dependencias externas por defecto).
onnx = []
# SPEC-0112: tipos geoespaciales opcionales (sin dependencias externas).
geo = []
# SPEC-0113: protocolo PostgreSQL wire (sin dependencias externas por defecto).
pgwire = []
# SPEC-0114: indice espacial R-tree (sin dependencias externas).
# Implica `geo` (tipos Point/Rect).
spatial = ["geo"]
# SPEC-0115: compresion de WAL (sin dependencias externas).
compression = []
# SPEC-0121: compresion zstd para WAL (dep opcional `zstd`).
zstd-compression = ["dep:zstd"]
# SPEC-0154: Compresion zstd real.
zstd-real = ["zstd-compression", "dep:zstd"]
# SPEC-0122: retention policies para time-series.
ts-retention = []
# SPEC-0123: fuzzy scoring en FTS.
fts-scoring = []
# SPEC-0124: engine columnar Arrow (dep opcional `arrow`).
arrow-columnar = ["dep:arrow"]
# SPEC-0125: IVF-PQ para vectores grandes.
ivf-pq = []
ivf-clustering = []
# SPEC-0126: OpenTelemetry OTLP exporter.
otel = []
# SPEC-0127: PostgreSQL wire protocol (pgwire real, dep opcional `pgwire`).
pgwire-real = ["pgwire", "dep:pgwire"]
# SPEC-0128: Checkpoint a S3 (backup/restore).
s3-backup = []
# SPEC-0129: Time-travel (read as of tx_id).
time-travel = []
# SPEC-0130: Copy-on-write B+tree.
cow-btree = []
# SPEC-0131: BEGIN CONCURRENT (multi-writer).
begin-concurrent = []
# SPEC-0136: Lance format (multimodal columnar).
lance-format = []
# SPEC-0137: Single-file VLE.
vle = []
# SPEC-0138: Sync protocol / replication.
sync = []
# SPEC-0139: Copy-on-write branching.
branching = []
# SPEC-0140: Geospatial projections (WGS84).
geo-proj = []
# SPEC-0141: SQL standard (window functions, CTEs, MERGE).
sql-std = []
# SPEC-0142: Cost-based planner.
cost-planner = []
# SPEC-0143: KMS/HSM externo.
kms = []
# SPEC-0144: Stemming Snowball (multi-idioma).
stemming = []
# SPEC-0145: Continuous aggregates.
ts-aggregates = []
# SPEC-0161: RQL expression language.
rql-expr = []
# SPEC-0162: RQL subqueries.
rql-subqueries = []
# SPEC-0163: RQL CTE.
rql-cte = []
# SPEC-0164: RQL set operations.
rql-set-ops = []
# SPEC-0165: RQL window functions.
rql-window-funcs = []
# SPEC-0166: Prepared statements real.
prepared-real = []
# SPEC-0167: Page checksums.
page-checksums = []
# SPEC-0168: Segmented WAL.
segmented-wal = []
# SPEC-0169: MVCC GC real.
mvcc-gc-real = []
# SPEC-0170: SSI.
ssi = []
# SPEC-0171: RaBitQ quantization.
rabitq = []
# SPEC-0172: ACORN filtered search.
acorn = []
# SPEC-0173: Persistent HNSW.
persistent-hnsw = []
# SPEC-0174: Learned index.
learned-index = []
# SPEC-0175: ALP compression.
alp = []
# SPEC-0176: FastLanes bit-packing.
fastlanes = []
# SPEC-0177: BlockMax WAND.
blockmax-wand = []
# SPEC-0178: Gorilla TS compression.
gorilla-ts = []
# SPEC-0179: CRDT sync real.
crdt-sync = []
# SPEC-0180: Post-quantum crypto.
post-quantum = []
# SPEC-0146: Epoch-based reclamation (RCU).
rcu = []
# SPEC-0148: Sentencias preparadas.
prepared = []
# SPEC-0149: Vistas materializadas.
materialized-views = []
# SPEC-0150: Aceleracion SIMD.
simd = []
# SPEC-0151: I/O asincrono.
async-io = []
# SPEC-0152: Busqueda por proximidad.
fts-proximity = []
# SPEC-0153: Reordenamiento de joins.
join-reorder = []
# SPEC-0154: Compresion zstd real.
# SPEC-0155: OpenTelemetry OTLP real.
otel-real = []
# SPEC-0156: R-tree con splitting.
rtree-split = []
# SPEC-0157: Verificacion de backup.
backup-verify = []
# SPEC-0158: Time-travel real.
time-travel-real = []
# SPEC-0159: Cache de resultados.
query-cache = []
# SPEC-0160: Evolucion de esquema.
schema-evolution = []
# SPEC-0148: Sentencias preparadas.
# SPEC-0149: Vistas materializadas.
# SPEC-0150: Aceleracion SIMD.
# SPEC-0151: I/O asincrono.
# SPEC-0152: Busqueda por proximidad.
# SPEC-0153: Reordenamiento de joins.
# SPEC-0154: Compresion zstd real.
# SPEC-0155: OpenTelemetry OTLP real.
# SPEC-0156: R-tree con splitting.
# SPEC-0157: Verificacion de backup.
# SPEC-0158: Time-travel real.
# SPEC-0159: Cache de resultados.
# SPEC-0160: Evolucion de esquema.
# SPEC-0116: backup online (sin dependencias externas).
backup = []
# SPEC-0117: full-text search avanzado (sin dependencias externas).
fts-advanced = []
# SPEC-0118: time-series avanzado (sin dependencias externas).
ts-advanced = []
# SPEC-0119: observabilidad (sin dependencias externas).
observability = []
# SPEC-0120: backup incremental (sin dependencias externas).
incremental-backup = []

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
pretty_assertions = { workspace = true }
criterion = { workspace = true }
# Lectura del registry en memoria de metrica en los tests (SPEC-0080, dev-only).
metrics-util = { workspace = true }

[[bench]]
name = "facade_smoke"
harness = false
