[package]
publish = false
name = "ruscadb-wal"
description = "Write-Ahead Log global y MVCC de RuscaDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Sin `#[bench]` en la lib (criterion vive en `benches/`).
[lib]
bench = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ruscadb-core = { workspace = true }
ruscadb-crypto = { workspace = true }
crc32c = { workspace = true }
# Spans de frontera (SPEC-0080): no-op sin subscriber, coste despreciable.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "wal_commit"
harness = false
