[package]
publish = false
name = "ruscadb-storage"
description = "Adapter de almacenamiento de RuscaDB (buffer pool LRU-K + paged file)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ruscadb-core = { workspace = true }
# Spans de frontera (SPEC-0080): no-op sin subscriber, coste despreciable.
tracing = { workspace = true }
# Métricas opcionales (SPEC-0080): solo presentes con la feature `metrics`.
metrics = { workspace = true, optional = true }

[features]
default = []
# Hit-rate del buffer pool (SPEC-0080): OFF por defecto (coste cero).
metrics = ["dep:metrics"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
