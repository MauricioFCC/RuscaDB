[package]
publish = false
name = "ruscadb-crypto"
description = "Cifrado en reposo de RuscaDB (XChaCha20-Poly1305 + Argon2id)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# SPEC-0180: ML-KEM (FIPS 203) + híbrido X25519+ML-KEM.
post-quantum = ["dep:libcrux-ml-kem", "dep:x25519-dalek", "dep:sha2"]

[dependencies]
ruscadb-core = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
# Keystore KMS-lite (SPEC-0088): fichero JSON versionado + nonces aleatorios.
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
# SPEC-0180: ML-KEM formalmente verificado (hax/F*) y combinador híbrido.
libcrux-ml-kem = { version = "0.0.11", optional = true, default-features = false, features = ["mlkem768"] }
x25519-dalek = { version = "3.0", optional = true, default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
