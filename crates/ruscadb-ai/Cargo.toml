[package]
publish = false
name = "ruscadb-ai"
description = "Inferencia local de embeddings de RuscaDB (Candle/ONNX)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Backend alterno opcional (F4). Apagado por defecto para no compilar C++ en F0.
onnx = []
# Embeddings estáticos model2vec (SPEC-0083, enmienda ADR-016): pesos
# safetensors LOCALES tras model2vec-rs; sin runtimes neuronales (Candle/ONNX
# siguen OFF) y sin red (local-only; fancy-regex en lugar de onig => sin C).
static-embeddings = ["dep:model2vec-rs"]

[dependencies]
ruscadb-core = { workspace = true }
model2vec-rs = { version = "0.3.0", optional = true, default-features = false, features = [
  "local-only",
  "fancy-regex",
] }

[dev-dependencies]
proptest = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
