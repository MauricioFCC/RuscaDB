# Ollama local delegation — tiers por capacidad (minimiza tokens cloud)
# Flota 2026-10-01 (RTX 4060 8GB, nombres canonicos hf.co; cada blob un solo
# nombre, sin alias locales). Reemplazo post-BSOD VIDEO_TDR_FAILURE (0x116):
# TODOS los tiers a num_ctx=8192, NO 16384 (el 9B + 16K + Vulkan en 8GB
# agoto la GPU el 2026-10-01). El techo vive en gpu_guard.SAFE_CTX_MAX.
#   fast:      Qwen3.5-4B UD-Q4_K_XL — borradores, tareas simples
#   quality:   MiMo-V2.6-Distill-Qwen-9B IQ4_XS — calidad/agente
#   coding:    JackOD-9B-Coder IQ4_XS — codigo agentico multi-turn (MTP)
#   reasoning: Ornith-1.5-9B Q4_K_M — razonamiento (fuera del enum YAML)
#   embedding: qwen3-embedding:0.6b — RAG (auto_pull lo restaura si se usa)
#   vision:    qwen3-vl:4b — imagenes/alt-text (auto_pull lo restaura si se usa)
# El servidor fija OLLAMA_CONTEXT_LENGTH=8192 (scripts/enable_gpu.py). El
# harness igual envia num_ctx explicito por options (fleet_manifest.py = SSOT).
ollama:
  base_url: "http://localhost:11434"
  timeout: 60
  # warm_on_start VACIO a proposito: precargar al arrancar sumaba VRAM en el
  # boot y contribuyo al BSOD TDR 2026-10-01. Los modelos se cargan bajo
  # demanda (y con el guard de gpu_guard.py). NO reactivar en 8GB.
  warm_on_start: []
  tiers:
    fast:      {model: "hf.co/unsloth/Qwen3.5-4B-GGUF:UD-Q4_K_XL",                keep_alive: "0", auto_pull: true}
    quality:   {model: "hf.co/bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF:IQ4_XS",  keep_alive: "0", auto_pull: true}
    coding:    {model: "mannix/JackOD-9B-Coder:IQ4_XS",                         keep_alive: "0", auto_pull: true}
    embedding: {model: "qwen3-embedding:0.6b", keep_alive: "0", auto_pull: true}
    vision:    {model: "qwen3-vl:4b",          keep_alive: "0", auto_pull: true}
# Politica local-first con supervision cloud como oraculo 1% (ADR-0084/0097):
# 99% local en destilados potentes; el cloud solo verifica muestras.
local_first:
  target_local_ratio: 0.99
  confidence_margin: 0.50
  sample_rate: 0.01
  env_prefix: "SWARMIND_LOCAL_"
