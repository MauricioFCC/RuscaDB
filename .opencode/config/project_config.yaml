# ── Licencia y Politica Open Source ───────────────────────────────────────────
# RuscaDB es un proyecto de codigo abierto bajo licencia MIT y se apoya en
# tecnologias open source. Al reutilizar codigo, snippets o ideas, SIEMPRE se
# acredita al autor original y su licencia.
LICENSE: "MIT"
OPEN_SOURCE_POLICY:
  uses_open_source: true
  attribution_required: true
  attribution_note: "Toda dependencia, snippet o idea reutilizada debe acreditar al autor original y citar su licencia"
  license_header_required: true
  preferred_licenses: ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC"]
  review_copyleft: ["GPL-3.0", "AGPL-3.0", "LGPL-3.0"]   # copyleft fuerte: revisar compatibilidad con MIT antes de adoptar

# ── ADRs y decisiones de diseno (LOCAL-ONLY) ──────────────────────────────────
# Los ADR y las decisiones de diseno se versionan SOLO en local para preservar
# el historial; NO se comitean ni se publican al remoto.
ADR_POLICY:
  committed: false
  path: "docs/adr/"
  format: "madr"                          # Markdown Architectural Decision Records
  note: "Se documentan en local (gitignoreado); jamas se comitean ni se publican"
