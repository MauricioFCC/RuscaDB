# .opencode/config/token_budgets.yaml — v2.1.0
# Presupuestos de tokens por agente (5 core) + tecnicas de economia v2026
# SSOT: unica fuente para presupuestos de tokens del sistema.
# (Las abreviaturas viven en core/base_principles.md)

defaults:
  base_budget: 2048
  response_buffer: 256
  compression_threshold: 0.85

