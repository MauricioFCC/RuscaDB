# Tecnicas de compresion por nivel
compression_levels:
  low:
    remove_redundant_phrases: false
    abbreviate_terms: false
    collapse_lists: false
    remove_examples: false
    aggressive_truncate: false
    
  medium:
    remove_redundant_phrases: true
    abbreviate_terms: true
    collapse_lists: true
    remove_examples: false
    aggressive_truncate: false
    
  high:
    remove_redundant_phrases: true
    abbreviate_terms: true
    collapse_lists: true
    remove_examples: true
    aggressive_truncate: true

# Abreviaturas centralizadas (SSOT con base_principles.md)
abbreviations:
  "out-of-sample": "OOS"
  "walk-forward validation": "WFV"
  "deflated sharpe ratio": "DSR"
  "stop loss": "SL"
  "take profit": "TP"
  "risk-reward ratio": "RR"
  "position sizing": "pos_size"
  "dependency injection": "DI"

# Frases redundantes a eliminar
redundant_phrases:
  - "es decir"
  - "en otras palabras"
  - "dicho de otro modo"
  - "cabe destacar que"
  - "por favor"
  - "como puedes ver"
  - "como se menciono anteriormente"
  - "en resumen"
  - "para concluir"

# Monitor de uso de tokens
monitoring:
  enabled: true
  log_threshold: 0.85
  metrics:
    - tokens_used
    - compression_applied
    - cache_hit_rate
    - failure_spend_ratio
    - phase_activation_count
    - fan_out_factor
    - tokens_per_parallel_agent
    - provider_cache_hit_rate

# Stop rules / abstencion (ADR-0039 #8, CONVOLVE 2606.28733)
# Politica declarativa: el runtime (Failure-Spend Governance + Circuit Breaker
# del coordinator) aplica la mecanica; estos umbrales son la config SSOT.
abstention_policy:
  enabled: true
  max_failure_spend_ratio: 0.30      # >30% del presupuesto en fallos -> abstener/re-planificar
  max_steps_without_progress: 5      # 5 pasos sin progreso medible -> parar y reportar
  abstain_message: "Sin progreso medible; se abstiene y reporta estado actual + siguiente accion"
  re_plan_after_abstain: true        # tras abstener, re-planificar con contexto reducido
