# Presupuesto de `unsafe` por crate (release-blocking).
#
# Regla (docs/RuscaDB-roadmap.md §6.3): `unsafe_code = "deny"` a nivel workspace.
# Solo crates designados pueden habilitarlo con `#![allow(unsafe_code)]`, y su
# conteo de bloques `unsafe` no puede superar este presupuesto. Ningún `unsafe`
# nuevo entra sin `// SAFETY:` + test/fuzz + revisión de un segundo ingeniero.
#
# `scripts/check_core_unsafe.py` verifica este archivo y el crate core.

[budget]
ruscadb-core = 0
ruscadb-storage = 0
ruscadb-query = 0
ruscadb-vector = 0
ruscadb-graph = 0
ruscadb-multimodal = 0
ruscadb-ai = 0
ruscadb-wal = 0
ruscadb-ffi = 0
ruscadb-py = 0
ruscadb-node = 0
ruscadb = 0
ruscadb-testkit = 0
