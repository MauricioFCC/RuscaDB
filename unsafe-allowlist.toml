# Presupuesto de `unsafe` por crate (release-blocking).
#
# Regla (docs/RuscaDB-roadmap.md §6.3): cada crate prohibe unsafe con
# `#![forbid(unsafe_code)]` salvo `ruscadb-ffi` (C-ABI), que lo habilita con
# `#![allow(unsafe_code)]` y cuyo conteo de bloques `unsafe` no puede superar
# este presupuesto. Ningún `unsafe` nuevo entra sin `// SAFETY:` + test.
#
# `scripts/check_core_unsafe.py` verifica este archivo y el crate core.

[budget]
ruscadb-core = 0
ruscadb-storage = 0
ruscadb-query = 0
ruscadb-vector = 0
ruscadb-graph = 0
ruscadb-multimodal = 0
ruscadb-ai = 0
ruscadb-wal = 0
# +7 (ciclo 5): dos funciones ABI de busqueda vectorial (`search_quantized` y
# `search_filtered`): atributo no_mangle + CStr/from_raw_parts con `// SAFETY:`.
ruscadb-ffi = 93
ruscadb-py = 0
ruscadb-node = 0
ruscadb = 0
ruscadb-testkit = 0
ruscadb-crypto = 0
