<?xml version="1.0" encoding="UTF-8"?>
<!--
  RuscaDB - Marca / icono principal (sin fondo).
  Concepto: cucaracha geometrica (Rusca = roach) dentro de un chip hexagonal
  con seis nodos de grafo. Geometria alineada a grid de 4 px.
  Paleta: cyan #22d3ee -> indigo #6366f1; tinta oscura #0b1020.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-labelledby="rusca-mark-title rusca-mark-desc">
  <title id="rusca-mark-title">RuscaDB</title>
  <desc id="rusca-mark-desc">Cucaracha geometrica, con pronoto y elitros divididos, dentro de un chip hexagonal con seis nodos de grafo. Simboliza una base de datos embebida, multi-modelo y multimodal.</desc>

  <defs>
    <!-- Gradiente continuo en espacio de usuario: cyan arriba a la izquierda, indigo abajo a la derecha -->
    <linearGradient id="rusca-gradient" gradientUnits="userSpaceOnUse" x1="20" y1="12" x2="108" y2="116">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <style>
    /* Variante monocroma opcional:
       agrega la clase "rusca-mono" al elemento svg, o incrusta el SVG y omite
       el color de texto para que currentColor tome el color heredado. */
    #rusca-mono { display: none; }
    .rusca-mono #rusca-color { display: none; }
    .rusca-mono #rusca-mono { display: inline; }
  </style>

  <!-- ============ Capa a color (por defecto) ============ -->
  <g id="rusca-color">
    <!-- Chip hexagonal: seis aristas que conectan los nodos -->
    <path d="M64 12 L108 38 L108 90 L64 116 L20 90 L20 38 Z"
          fill="none" stroke="url(#rusca-gradient)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Seis nodos de grafo en los vertices -->
    <g fill="#22d3ee">
      <circle cx="64" cy="12" r="6"/>
      <circle cx="108" cy="38" r="6"/>
      <circle cx="108" cy="90" r="6"/>
      <circle cx="64" cy="116" r="6"/>
      <circle cx="20" cy="90" r="6"/>
      <circle cx="20" cy="38" r="6"/>
    </g>

    <!-- Seis patas consistentes (detras del cuerpo, raices ocultas) -->
    <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M54 63 L40 52"/>
      <path d="M50 74 L36 74"/>
      <path d="M55 84 L42 96"/>
      <path d="M74 63 L88 52"/>
      <path d="M78 74 L92 74"/>
      <path d="M73 84 L86 96"/>
    </g>

    <!-- Dos antenas -->
    <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M59 48 C54 42 49 36 44 27"/>
      <path d="M69 48 C74 42 79 36 84 27"/>
    </g>

    <!-- Cuerpo: elitros divididos -->
    <path d="M64 57 L49 62 L48 74 L53 87 L64 96 Z" fill="url(#rusca-gradient)"/>
    <path d="M64 57 L79 62 L80 74 L75 87 L64 96 Z" fill="url(#rusca-gradient)"/>
    <!-- Linea central de los elitros -->
    <path d="M64 57 L64 96" stroke="#0b1020" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Pronoto (escudo cefalico) -->
    <path d="M64 44 L74 49 L77 60 L51 60 L54 49 Z" fill="url(#rusca-gradient)"
          stroke="#0b1020" stroke-width="1.5" stroke-linejoin="round" opacity="0.98"/>
  </g>

  <!-- ============ Capa monocroma opcional (currentColor) ============ -->
  <g id="rusca-mono" fill="currentColor" stroke="currentColor">
    <path d="M64 12 L108 38 L108 90 L64 116 L20 90 L20 38 Z"
          fill="none" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="none">
      <circle cx="64" cy="12" r="6"/>
      <circle cx="108" cy="38" r="6"/>
      <circle cx="108" cy="90" r="6"/>
      <circle cx="64" cy="116" r="6"/>
      <circle cx="20" cy="90" r="6"/>
      <circle cx="20" cy="38" r="6"/>
    </g>
    <g stroke-width="4" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M54 63 L40 52"/>
      <path d="M50 74 L36 74"/>
      <path d="M55 84 L42 96"/>
      <path d="M74 63 L88 52"/>
      <path d="M78 74 L92 74"/>
      <path d="M73 84 L86 96"/>
    </g>
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M59 48 C54 42 49 36 44 27"/>
      <path d="M69 48 C74 42 79 36 84 27"/>
    </g>
    <!-- Elitros con separacion de 2 px para conservar la linea central en mono -->
    <path d="M63 57.5 L49 62 L48 74 L53 87 L63 95.5 Z" fill="currentColor" stroke="none"/>
    <path d="M65 57.5 L79 62 L80 74 L75 87 L65 95.5 Z" fill="currentColor" stroke="none"/>
    <path d="M64 44 L74 49 L77 60 L51 60 L54 49 Z" fill="currentColor" stroke="none"/>
  </g>
</svg>
