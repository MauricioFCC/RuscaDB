<?xml version="1.0" encoding="UTF-8"?>
<!--
  RuscaDB - Diagrama de arquitectura hexagonal (1200x700).
  Mismas flechas que el mermaid del README: los adaptadores apuntan al core.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">RuscaDB architecture</title>
  <desc id="arch-desc">Arquitectura hexagonal: los clientes usan la fachada ruscadb, que compone query, txn, wal, storage e indices; todos dependen de ruscadb-core.</desc>

  <defs>
    <linearGradient id="arch-accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="700">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="arch-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0 L9 3 L0 6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#0b1020"/>

  <text x="48" y="60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Hexagonal architecture</text>
  <text x="48" y="92" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#94a3b8">dependency arrows always point to ruscadb-core</text>

  <!-- Clientes -->
  <rect x="48" y="140" width="250" height="90" rx="12" fill="#111834" stroke="#2a3354"/>
  <text x="70" y="180" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#f8fafc">Clients</text>
  <text x="70" y="208" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#94a3b8">Rust - Python - Node - C - WASM - MCP</text>

  <!-- Fachada -->
  <rect x="380" y="130" width="380" height="110" rx="14" fill="#0f1730" stroke="url(#arch-accent)" stroke-width="2"/>
  <text x="404" y="176" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">ruscadb</text>
  <text x="404" y="206" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#22d3ee">facade / composition root (Database)</text>

  <!-- Adaptadores -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#f8fafc">
    <rect x="380" y="300" width="180" height="60" rx="10" fill="#111834" stroke="#2a3354"/>
    <text x="398" y="336">query (RQL)</text>
    <rect x="580" y="300" width="180" height="60" rx="10" fill="#111834" stroke="#2a3354"/>
    <text x="598" y="336">txn (MVCC)</text>
    <rect x="380" y="380" width="180" height="60" rx="10" fill="#111834" stroke="#2a3354"/>
    <text x="398" y="416">wal (CRC32C)</text>
    <rect x="580" y="380" width="180" height="60" rx="10" fill="#111834" stroke="#2a3354"/>
    <text x="598" y="416">storage (pool)</text>
  </g>

  <!-- Indices -->
  <rect x="380" y="460" width="380" height="70" rx="10" fill="#111834" stroke="#2a3354"/>
  <text x="398" y="490" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#f8fafc">vector - fvs - graph - fts - btree - ts</text>
  <text x="398" y="514" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#f8fafc">multimodal - ai - crypto</text>

  <!-- Core -->
  <rect x="880" y="130" width="272" height="400" rx="14" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-width="2"/>
  <text x="904" y="200" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">ruscadb-core</text>
  <text x="904" y="230" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#94a3b8">Record - ScalarValue</text>
  <text x="904" y="254" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#94a3b8">RuscaError - ports</text>
  <text x="904" y="300" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#22d3ee">no frameworks, no IO</text>
  <text x="904" y="324" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#22d3ee">forbid(unsafe_code)</text>

  <!-- Flechas -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arch-arrow)">
    <path d="M298 185 L374 185"/>
    <path d="M570 240 L470 296"/>
    <path d="M570 240 L670 296"/>
    <path d="M470 300 L470 376"/>
    <path d="M670 300 L670 376"/>
    <path d="M470 376 L470 456"/>
    <path d="M670 376 L670 456"/>
    <path d="M760 300 L876 300"/>
    <path d="M760 410 L876 380"/>
    <path d="M760 495 L876 450"/>
    <path d="M760 330 L876 320"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arch-arrow)" opacity="0.8">
    <path d="M900 560 L900 536"/>
  </g>
  <text x="470" y="596" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#64748b">0 ciclos - 0 aristas prohibidas (scripts/check_architecture.py)</text>
</svg>
