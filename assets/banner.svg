<?xml version="1.0" encoding="UTF-8"?>
<!--
  RuscaDB - Banner del repositorio (1280x640).
  Fondo ink #0b1020, acento cyan #22d3ee -> indigo #6366f1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">RuscaDB</title>
  <desc id="banner-desc">Banner de RuscaDB: base de datos embebida, multi-modelo y multimodal escrita en Rust. Small. Omnivorous. Indestructible.</desc>

  <defs>
    <linearGradient id="banner-gradient" gradientUnits="userSpaceOnUse" x1="120" y1="80" x2="640" y2="560">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="banner-glow" gradientUnits="userSpaceOnUse" cx="300" cy="300" r="520">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0b1020"/>
  <rect width="1280" height="640" fill="url(#banner-glow)"/>

  <!-- Rejilla tecnica de fondo -->
  <g stroke="#1b2340" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M160 0 V640 M320 0 V640 M480 0 V640 M640 0 V640 M800 0 V640 M960 0 V640 M1120 0 V640"/>
  </g>

  <!-- Marca: chip hexagonal + cucaracha geometrica -->
  <g transform="translate(96,168) scale(2.25)">
    <path d="M64 12 L108 38 L108 90 L64 116 L20 90 L20 38 Z"
          fill="none" stroke="url(#banner-gradient)" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#22d3ee">
      <circle cx="64" cy="12" r="6"/>
      <circle cx="108" cy="38" r="6"/>
      <circle cx="108" cy="90" r="6"/>
      <circle cx="64" cy="116" r="6"/>
      <circle cx="20" cy="90" r="6"/>
      <circle cx="20" cy="38" r="6"/>
    </g>
    <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M54 63 L40 52"/>
      <path d="M50 74 L36 74"/>
      <path d="M55 84 L42 96"/>
      <path d="M74 63 L88 52"/>
      <path d="M78 74 L92 74"/>
      <path d="M73 84 L86 96"/>
    </g>
    <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M59 48 C54 42 49 36 44 27"/>
      <path d="M69 48 C74 42 79 36 84 27"/>
    </g>
    <path d="M64 57 L49 62 L48 74 L53 87 L64 96 Z" fill="url(#banner-gradient)"/>
    <path d="M64 57 L79 62 L80 74 L75 87 L64 96 Z" fill="url(#banner-gradient)"/>
    <path d="M64 44 L74 49 L77 60 L51 60 L54 49 Z" fill="url(#banner-gradient)" opacity="0.98"/>
  </g>

  <!-- Wordmark y eslogan -->
  <text x="480" y="286" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="96" font-weight="700" fill="#f8fafc">RuscaDB</text>
  <text x="484" y="336" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="30" font-weight="600" fill="url(#banner-gradient)">Small. Omnivorous. Indestructible.</text>
  <text x="484" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="26" fill="#94a3b8">Embedded, multi-model and multimodal database in Rust</text>
  <text x="484" y="432" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="22" fill="#64748b">Relational - Document - Graph - Vector - Time-series - Multimodal</text>

  <!-- Chips de capacidades -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#cbd5e1">
    <rect x="484" y="470" width="150" height="40" rx="8" fill="#111834" stroke="#2a3354"/>
    <text x="504" y="497">WAL + MVCC</text>
    <rect x="648" y="470" width="150" height="40" rx="8" fill="#111834" stroke="#2a3354"/>
    <text x="668" y="497">RQL</text>
    <rect x="812" y="470" width="150" height="40" rx="8" fill="#111834" stroke="#2a3354"/>
    <text x="832" y="497">HNSW</text>
    <rect x="976" y="470" width="196" height="40" rx="8" fill="#111834" stroke="#2a3354"/>
    <text x="996" y="497">XCHACHA20-POLY</text>
  </g>
</svg>
