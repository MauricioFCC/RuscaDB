<?xml version="1.0" encoding="UTF-8"?>
<!--
  RuscaDB - Icono sobre tile redondeado oscuro (avatar / app icon).
  Tile #0b1020 con radio 28 px y marca centrada.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-labelledby="rusca-dark-title rusca-dark-desc">
  <title id="rusca-dark-title">RuscaDB</title>
  <desc id="rusca-dark-desc">Icono de RuscaDB sobre tile oscuro redondeado, con la cucaracha geometrica dentro del chip hexagonal y sus nodos de grafo.</desc>

  <defs>
    <linearGradient id="rusca-gradient" gradientUnits="userSpaceOnUse" x1="20" y1="12" x2="108" y2="116">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="rusca-glow" cx="50%" cy="42%" r="64%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <g id="rusca-mark">
      <path d="M64 12 L108 38 L108 90 L64 116 L20 90 L20 38 Z"
            fill="none" stroke="url(#rusca-gradient)" stroke-width="5" stroke-linejoin="round"/>
      <g fill="#22d3ee">
        <circle cx="64" cy="12" r="6"/>
        <circle cx="108" cy="38" r="6"/>
        <circle cx="108" cy="90" r="6"/>
        <circle cx="64" cy="116" r="6"/>
        <circle cx="20" cy="90" r="6"/>
        <circle cx="20" cy="38" r="6"/>
      </g>
      <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.92">
        <path d="M54 63 L40 52"/>
        <path d="M50 74 L36 74"/>
        <path d="M55 84 L42 96"/>
        <path d="M74 63 L88 52"/>
        <path d="M78 74 L92 74"/>
        <path d="M73 84 L86 96"/>
      </g>
      <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M59 48 C54 42 49 36 44 27"/>
        <path d="M69 48 C74 42 79 36 84 27"/>
      </g>
      <path d="M64 57 L49 62 L48 74 L53 87 L64 96 Z" fill="url(#rusca-gradient)"/>
      <path d="M64 57 L79 62 L80 74 L75 87 L64 96 Z" fill="url(#rusca-gradient)"/>
      <path d="M64 57 L64 96" stroke="#0b1020" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M64 44 L74 49 L77 60 L51 60 L54 49 Z" fill="url(#rusca-gradient)"
            stroke="#0b1020" stroke-width="1.5" stroke-linejoin="round" opacity="0.98"/>
    </g>
  </defs>

  <!-- Tile oscuro + halo sutil + borde tenue -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0b1020"/>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#rusca-glow)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25"
        fill="none" stroke="#1b2340" stroke-width="1.5"/>

  <use href="#rusca-mark"/>
</svg>
