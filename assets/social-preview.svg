  <title id="og-title">RuscaDB - Embedded, multi-model and multimodal database in Rust</title>
  <desc id="og-desc">Tarjeta social de RuscaDB con la marca geometrica de chip hexagonal y cucaracha, el eslogan Small. Omnivorous. Indestructible. y las capacidades WAL, MVCC, RQL, HNSW y cifrado XChaCha20-Poly1305.</desc>

