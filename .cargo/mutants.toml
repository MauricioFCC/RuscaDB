# cargo-mutants — configuración de TDD adversarial (AdverTest) para RuscaDB.
#
# Gate T2 (merge):    cargo mutants --in-diff pr.diff --shard k/n --in-place --baseline=skip
#   Mutation score objetivo: >= 70 % (roadmap FF-08).
# Gate T3 (nightly):  cargo mutants --workspace --shard k/8 --in-place
#   Mutation score objetivo: >= 85 % (alert-only; ver .github/workflows/nightly.yml).
#
# Toolchain: el pin de reproducibilidad vive en `rust-toolchain.toml` (canal
# estable). cargo-mutants invoca `cargo`, por lo que hereda ese toolchain; la
# selección explícita se realiza en la invocación (`cargo +<toolchain> mutants`).
# NOTA: cargo-mutants usa `deny_unknown_fields`, así que NO existe una clave
# `toolchain` en este archivo; solo se declaran claves válidas para no romper
# T1/T2/T3.
#
# Este archivo NO debe romper T1: los argumentos extra se limitan a `--locked`
# (build reproducible), sin `--all-features` ni perfiles que alarguen el gate
# determinista de < 90 s.

# No mutar tests ni benches (el mutante debe atacar código de producción).
exclude_globs = [
    "crates/*/tests/**",
    "crates/*/benches/**",
    "crates/*/examples/**",
]

# Runner de tests = `cargo test` (mismo motor que T1), con lockfile fijado.
test_tool = "cargo"

# Argumentos extra para `cargo test` (perfil determinista).
additional_cargo_test_args = ["--locked"]
